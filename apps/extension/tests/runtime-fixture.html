<!doctype html><html><head><meta charset="utf-8"><title>Solvane extension runtime fixture</title></head><body>
<h1>Claude fixture · real Solvane checkpoint API</h1><p id="read-count">Assistant DOM reads: 0</p><button id="complete">Finish assistant update</button><button id="stream">Begin streaming</button><button id="limit">Show usage limit</button><button id="auto">Enable auto-detect</button><button id="offline">Toggle network failure</button><pre id="diagnostic"></pre><main><div data-testid="user-message">Build Project X with human-reviewed state.</div><div data-testid="assistant-message" id="assistant">Task started.</div><textarea placeholder="Claude composer"></textarea></main>
<script>
const sync=JSON.parse(localStorage.getItem('fixture-sync')||'{}'),local=JSON.parse(localStorage.getItem('fixture-local')||'{}'),listeners=[];let offline=false,reads=0;
const store=(values,key)=>({get:(key,callback)=>callback({[key]:values[key]}),set:(change,callback)=>{Object.assign(values,change);localStorage.setItem(key,JSON.stringify(values));listeners.forEach(listener=>listener(Object.fromEntries(Object.entries(change).map(([name,newValue])=>[name,{newValue}])),key==='fixture-sync'?'sync':'local'));callback?.();},remove:(name,callback)=>{delete values[name];localStorage.setItem(key,JSON.stringify(values));callback?.();}});
window.chrome={storage:{sync:store(sync,'fixture-sync'),local:store(local,'fixture-local'),onChanged:{addListener:fn=>listeners.push(fn)}},runtime:{sendMessage:(message,callback)=>{if(offline){callback({ok:false,status:0,body:JSON.stringify({error:'Network unavailable'})});return;}const url=new URL(message.url);fetch(location.origin+url.pathname+url.search,{...message.init,credentials:'include'}).then(async(response)=>callback({ok:response.ok,status:response.status,body:await response.text()}));}}};
const original=document.querySelectorAll.bind(document);document.querySelectorAll=(selector)=>{if(selector.includes('assistant')||selector.includes('streaming')){reads++;document.getElementById('read-count').textContent='Assistant DOM reads: '+reads;}return original(selector);};
document.getElementById('auto').onclick=()=>chrome.storage.sync.set({solvaneAutomationSettings:{autoDetect:true,reminders:true,enabledSites:['claude','openai','gemini','perplexity'],providerOrder:['claude','openai','gemini','perplexity']}});
document.getElementById('stream').onclick=()=>{const assistant=document.getElementById('assistant');assistant.setAttribute('data-is-streaming','true');assistant.textContent='<<<SOLVANE_UPDATE v1 {partial';};
document.getElementById('complete').onclick=()=>{const assistant=document.getElementById('assistant');assistant.setAttribute('data-is-streaming','false');assistant.textContent='<<<SOLVANE_UPDATE v1 '+JSON.stringify({decisions_add:['Use SQLite for fixture project'],done_add:['Finished runtime fixture task'],open_questions_add:[],open_questions_resolve:[],constraints_add:[],next_step:'Test the ChatGPT handoff',changes:[]})+' SOLVANE_UPDATE>>>';};
document.getElementById('limit').onclick=()=>{document.getElementById('assistant').textContent='Usage limit reached. Try again later.';};
document.getElementById('offline').onclick=()=>{offline=!offline;document.getElementById('diagnostic').textContent='Offline simulation: '+offline;};
window.open=(url)=>{document.getElementById('diagnostic').textContent='Opened target: '+url;return {closed:false,location:{set href(value){document.getElementById('diagnostic').textContent='Opened target: '+value;}}};};
</script><script src="provider-config.js"></script><script>window.SOLVANE_PROVIDER_CONFIG.providers.claude.hostname=location.hostname;</script><script src="checkpoint-core.js"></script><script src="content.js"></script></body></html>
