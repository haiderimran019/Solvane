<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solvane Browser Bridge settings</title><style>body{margin:0;padding:32px;max-width:680px;background:#f4f6ef;color:#171a15;font:15px/1.5 system-ui,sans-serif}main{padding:28px;border:1px solid #d6dccd;border-radius:20px;background:#fff;box-shadow:0 16px 40px #1b251514}h1{margin:0 0 4px;font-size:26px}p{color:#65705f}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-top:1px solid #e6eadf}label{font-weight:700}small{display:block;color:#788174;font-weight:400}input,select{min-height:38px;padding:0 10px;border:1px solid #cbd3c2;border-radius:9px;background:#fff}.save{margin-top:18px;padding:11px 16px;border:0;border-radius:10px;background:#c8ff32;color:#10130e;font-weight:800;cursor:pointer}.notice{margin-top:14px;color:#4d6513;font-weight:700}</style></head><body><main><h1>Solvane Browser Bridge</h1><p>Automation stays off until you enable it. When enabled, Solvane reads only the latest visible assistant message to look for a complete update block or a usage-limit notice. It never reads cookies, passwords, hidden reasoning, or chat content for diagnostics.</p><div class="row"><label>Auto-detect update blocks<small>Pulse “Update ready — Save” after streaming finishes.</small></label><input id="autoDetect" type="checkbox"></div><div class="row"><label>Checkpoint reminders<small>Gentle reminder after about 30 minutes or 15 messages.</small></label><input id="reminders" type="checkbox" checked></div><div class="row"><label>Default handoff<small>Used by Save & continue banners.</small></label><select id="defaultHandoff"><option value="last">Last used</option><option value="claude">Claude</option><option value="gemini">Gemini</option><option value="openai">ChatGPT</option><option value="perplexity">Perplexity</option></select></div><button class="save" id="save">Save settings</button><div class="notice" id="notice" role="status"></div></main><script src="options.js"></script></body></html>
