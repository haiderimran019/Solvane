name: Deploy Solvane workspace to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - pages/**
      - scripts/build-pages.mjs
      - package.json
      - apps/web/lib/checkpoint.ts
      - apps/web/lib/product.ts
      - apps/web/public/favicon.svg
      - .github/workflows/pages.yml
      - LICENSE
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
